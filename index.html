<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SAQUE ON — Agende seu horário</title>
    <meta name="description" content="Agendamento de quadras de tênis do Nosso Tênis." />
    <meta name="theme-color" content="#0F1E36" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-100 font-['Plus_Jakarta_Sans',sans-serif] antialiased">
    <div id="root"></div>
    <!-- v111: leitor QR compatível com Safari/iPhone via polyfill WASM. O leitor nativo é usado quando disponível. -->
    <script src="https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@0.9.15/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@undecaf/barcode-detector-polyfill@0.9.23/dist/index.js"></script>
    <script>
      try {
        if (!window.BarcodeDetector && window.barcodeDetectorPolyfill?.BarcodeDetectorPolyfill) {
          window.BarcodeDetector = window.barcodeDetectorPolyfill.BarcodeDetectorPolyfill;
        }
      } catch (_) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
